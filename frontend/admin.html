<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli - Otopark Doluluk ve Rezervasyon Sistemi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🚗 Otopark Doluluk ve Rezervasyon Sistemi</h1>
        <nav>
            <a href="dashboard.html">Park Yerleri</a>
            <a href="reservations.html">Rezervasyonlarım</a>
            <a href="admin.html" id="admin-nav-link" class="active">Yönetim Paneli</a>
            <a href="/api-docs" target="_blank">Swagger API</a>
            <span id="user-greeting" class="user-greeting"></span>
            <button type="button" id="logout-btn" class="btn btn-secondary btn-sm">Çıkış Yap</button>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Park Yeri Yönetim Paneli</h2>
            <span id="admin-spots-count" class="badge badge-info">Yükleniyor...</span>
        </section>

        <div id="alert-box" class="alert"></div>

        <div class="admin-layout">
            <!-- Sol Sütun: Park Yeri Ekleme / Güncelleme Formu -->
            <section class="card">
                <h3 id="form-heading" style="margin-bottom: 1rem;">Yeni Park Yeri Ekle</h3>

                <form id="spot-form">
                    <input type="hidden" id="edit-spot-id">

                    <div class="form-group">
                        <label for="spot-code">Park Yeri Kodu</label>
                        <input type="text" id="spot-code" required maxlength="20" placeholder="Örn: D-01">
                    </div>

                    <div class="form-group">
                        <label for="spot-floor">Kat Bilgisi</label>
                        <input type="number" id="spot-floor" required min="-5" max="20" step="1" value="1">
                    </div>

                    <div class="form-group">
                        <label for="spot-type">Park Yeri Tipi</label>
                        <select id="spot-type" required>
                            <option value="standart">Standart</option>
                            <option value="elektrikli">Elektrikli</option>
                            <option value="engelli">Engelli</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="hourly-rate">Saatlik Ücret (₺)</label>
                        <input type="number" id="hourly-rate" required min="0" step="0.50" placeholder="50.00">
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="spot-active" checked>
                            Kullanıma Açık (Aktif)
                        </label>
                    </div>

                    <div class="form-actions-stack">
                        <button type="submit" id="save-spot-btn" class="btn btn-block">Park Yeri Ekle</button>
                        <button type="button" id="cancel-edit-btn" class="btn btn-secondary btn-block" style="display: none;">Düzenlemeyi İptal Et</button>
                    </div>
                </form>
            </section>

            <!-- Sağ Sütun: Mevcut Park Yerleri Tablosu -->
            <section class="card">
                <h3 style="margin-bottom: 1rem;">Kayıtlı Park Yerleri</h3>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Kod</th>
                                <th>Kat</th>
                                <th>Tip</th>
                                <th>Saatlik Ücret</th>
                                <th>Durum</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="admin-spots-tbody">
                            <tr>
                                <td colspan="6" class="loading-state">Park yerleri yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
