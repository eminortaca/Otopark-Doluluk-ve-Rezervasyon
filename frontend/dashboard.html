<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Yerleri - Otopark Doluluk ve Rezervasyon Sistemi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🚗 Otopark Doluluk ve Rezervasyon Sistemi</h1>
        <nav>
            <a href="dashboard.html" class="active">Park Yerleri</a>
            <a href="reservations.html">Rezervasyonlarım</a>
            <a href="admin.html" id="admin-nav-link" style="display: none;">Yönetim Paneli</a>
            <a href="/api-docs" target="_blank">Swagger API</a>
            <span id="user-greeting" class="user-greeting"></span>
            <button type="button" id="logout-btn" class="btn btn-secondary btn-sm">Çıkış Yap</button>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Otopark Alanları</h2>
            <span id="total-spots-info" class="badge badge-info">Yükleniyor...</span>
        </section>

        <!-- Arama ve Filtreleme Alanı -->
        <section class="card">
            <form id="filter-form" class="filter-bar">
                <div class="form-group">
                    <label for="search-input">Park Yeri Kodu</label>
                    <input type="text" id="search-input" placeholder="Örn: A-01, B-02">
                </div>

                <div class="form-group">
                    <label for="floor-filter">Kat</label>
                    <select id="floor-filter">
                        <option value="">Tümü</option>
                        <option value="-1">Bodrum Kat (-1)</option>
                        <option value="1">1. Kat</option>
                        <option value="2">2. Kat</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="type-filter">Park Yeri Tipi</label>
                    <select id="type-filter">
                        <option value="">Tümü</option>
                        <option value="standart">Standart</option>
                        <option value="elektrikli">Elektrikli</option>
                        <option value="engelli">Engelli</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="active-filter">Durum</label>
                    <select id="active-filter">
                        <option value="">Tümü</option>
                        <option value="true">Kullanıma Açık</option>
                        <option value="false">Bakımda</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn">Filtrele</button>
                    <button type="button" id="reset-filters-btn" class="btn btn-secondary">Temizle</button>
                </div>
            </form>
        </section>

        <div id="alert-box" class="alert"></div>

        <!-- Park Yerleri Kart Listesi -->
        <section id="spots-container" class="grid" aria-live="polite">
            <article class="card loading-state">Park yerleri yükleniyor...</article>
        </section>

        <!-- Sayfalama Kontrolleri -->
        <div id="pagination-controls" class="pagination">
            <button type="button" id="prev-page-btn" class="btn btn-secondary btn-sm" disabled>Önceki</button>
            <span id="page-info" class="page-info">Sayfa 1 / 1</span>
            <button type="button" id="next-page-btn" class="btn btn-secondary btn-sm" disabled>Sonraki</button>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
