<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt - Otopark Rezervasyon Sistemi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🚗 Otopark Doluluk ve Rezervasyon Sistemi</h1>
        <nav>
            <a href="/api-docs" target="_blank">Swagger API Docs</a>
        </nav>
    </header>

    <main>
        <section class="card auth-container">
            <h2 id="form-title" style="margin-bottom: 1rem; text-align: center;">Kullanıcı Girişi</h2>
            
            <div id="alert-box" class="alert"></div>

            <!-- Giriş Formu -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">E-posta Adresi</label>
                    <input type="email" id="login-email" required placeholder="ornek@otopark.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Şifre</label>
                    <input type="password" id="login-password" required placeholder="••••••">
                </div>
                <button type="submit" class="btn btn-block">Giriş Yap</button>
            </form>

            <!-- Kayıt Formu (Başlangıçta gizli) -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-name">Ad Soyad</label>
                    <input type="text" id="reg-name" required minlength="3" placeholder="Adınız Soyadınız">
                </div>
                <div class="form-group">
                    <label for="reg-email">E-posta Adresi</label>
                    <input type="email" id="reg-email" required placeholder="ornek@otopark.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Şifre (En az 6 karakter)</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="••••••">
                </div>
                <button type="submit" class="btn btn-block">Kayıt Ol</button>
            </form>

            <p style="margin-top: 1.2rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                <span id="toggle-text">Hesabınız yok mu?</span>
                <a href="#" id="toggle-link" style="color: var(--primary); font-weight: 600;">Kayıt Olun</a>
            </p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
